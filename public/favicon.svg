<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded background circle in brand pink -->
  <circle cx="12" cy="12" r="11" fill="#E8B9BA" />
  
  <!-- Coffee steam -->
  <path d="M7 5c.3.8-.5 1.5 0 2.2M11 4c.3 1-.5 1.8 0 2.5" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Handle -->
  <path d="M16.5 11c1.5 0 2.5.6 2.5 1.6s-.8 1.6-2.5 1.6" stroke="#2D2D2D" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cup body with clipPath for tricolor stripes -->
  <g clip-path="url(#cup-clip)">
    <!-- Cup background -->
    <path d="M5 9h12l-1.2 7.2c-.3 1.8-1.8 3.2-3.6 3.2H9.8c-1.8 0-3.3-1.4-3.6-3.2L5 9z" fill="#FFFFFF"/>
    <!-- Stripes: Blue, White, Red -->
    <!-- Blue stripe (left 1/3) -->
    <rect x="5" y="8" width="4" height="15" fill="#0050A1"/>
    <!-- White stripe (middle 1/3) -->
    <rect x="9" y="8" width="4" height="15" fill="#FFFFFF"/>
    <!-- Red stripe (right 1/3) -->
    <rect x="13" y="8" width="4" height="15" fill="#AC595B"/>
  </g>
  <!-- Cup outline to make it clean -->
  <path d="M5 9h12l-1.2 7.2c-.3 1.8-1.8 3.2-3.6 3.2H9.8c-1.8 0-3.3-1.4-3.6-3.2L5 9z" stroke="#2D2D2D" stroke-width="1.8" stroke-linejoin="round"/>
  
  <defs>
    <clipPath id="cup-clip">
      <path d="M5 9h12l-1.2 7.2c-.3 1.8-1.8 3.2-3.6 3.2H9.8c-1.8 0-3.3-1.4-3.6-3.2L5 9z"/>
    </clipPath>
  </defs>
</svg>
