<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="fav-flag-clip">
      <ellipse cx="45.5" cy="43" rx="27" ry="8.8" />
    </clipPath>
  </defs>

  <!-- 1. Rising Steam Wisps (Deep rose pink) -->
  <g fill="none" stroke="#AC595B" stroke-width="3.6" stroke-linecap="round">
    <path d="M 37 25 C 31 18, 43 11, 35 3" />
    <path d="M 47 23 C 53 17, 41 9, 49 2" />
  </g>

  <!-- 2. Cup Handle (Solid blush pink porcelain) -->
  <path
    d="M 74 44 C 88 41, 98 50, 98 63 C 98 75, 87 83, 72 79 C 67 77.5, 64 73.5, 62 70.5 C 65 70, 69 73, 74 74 C 82 75.5, 89 71, 89 63 C 89 55, 82 49, 73 50 Z"
    fill="#F7A8B8"
    stroke="#B84E64"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- 3. Base Pedestal Foot -->
  <path
    d="M 31 87 L 29 92 C 29 94.5, 60 94.5, 60 92 L 58 87 Z"
    fill="#E27F93"
    stroke="#B84E64"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- 4. Cup Outer Body (Vibrant sweet pink porcelain) -->
  <path
    d="M 13 42 C 13 65, 25 84, 33 87 C 39 89.5, 51 89.5, 56 87 C 64 84, 76 65, 76 42 C 76 55, 13 55, 13 42 Z"
    fill="#F7A8B8"
    stroke="#B84E64"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- 5. Inner Back Wall (Warm rose depth shadow) -->
  <ellipse
    cx="45.5"
    cy="41.5"
    rx="31.5"
    ry="11.5"
    fill="#D36B81"
    stroke="#B84E64"
    stroke-width="1.6"
  />

  <!-- 6. French Flag Liquid Surface -->
  <g clip-path="url(#fav-flag-clip)">
    <!-- French Blue (Left) -->
    <rect x="14" y="32" width="21.5" height="24" fill="#0C438C" />
    <!-- French White (Middle) -->
    <rect x="35.5" y="32" width="20" height="24" fill="#FFFFFF" />
    <!-- French Red (Right) -->
    <rect x="55.5" y="32" width="21.5" height="24" fill="#DE2030" />
  </g>

  <!-- Inner Lip Seam -->
  <ellipse
    cx="45.5"
    cy="43"
    rx="27"
    ry="8.8"
    stroke="#9E3B50"
    stroke-width="1"
    fill="none"
    opacity="0.6"
  />

  <!-- 7. Cup Body Curvature Glaze Highlight (Left vertical highlight ONLY) -->
  <path
    d="M 20 49 C 17 62, 24 76, 30 81"
    stroke="#FFFFFF"
    stroke-width="2.6"
    stroke-linecap="round"
    fill="none"
    opacity="0.8"
  />
